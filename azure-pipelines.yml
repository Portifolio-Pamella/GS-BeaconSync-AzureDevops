trigger:
  - main

variables:
  buildConfiguration: 'Release'
  webAppName: 'rm565206-beaconsync-api'

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '9.x'

  # Usa **/*.sln para buscar o arquivo automaticamente onde quer que ele esteja
  - script: dotnet restore "**/*.sln"
    displayName: 'Restaurar Dependências'

  - script: dotnet build "**/*.sln" --configuration $(buildConfiguration) --no-restore
    displayName: 'Compilar Solution .NET'

  - script: dotnet publish "**/BeaconSync.API.csproj" --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/drop --no-build
    displayName: 'Publicar Projeto API'

  - task: AzureWebApp@1
    inputs:
      azureSubscription: 'AzureServiceConnection'
      appName: '$(webAppName)'
      package: '$(Build.ArtifactStagingDirectory)/drop/**/*.zip'