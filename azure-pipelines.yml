trigger:
  branches:
    include:
      - main
      - master

# Adicionado para atender à validação automática via Pull Request (Requisito 04)
pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  webAppName: 'rm565206-beaconsync-api'

stages:
  - stage: Build
    displayName: 'Estágio de Build e Testes'
    jobs:
      - job: BuildJob
        displayName: 'Compilar e Testar .NET 10'
        steps:
          - task: UseDotNet@2
            displayName: 'Instalar SDK do .NET 10'
            inputs:
              version: '10.x'

          - task: DotNetCoreCLI@2
            displayName: 'Restaurar pacotes NuGet'
            inputs:
              command: 'restore'
              projects: 'BeaconSync.slnx'

          - task: DotNetCoreCLI@2
            displayName: 'Compilar projeto (Build)'
            inputs:
              command: 'build'
              projects: 'BeaconSync.slnx'
              arguments: '--configuration $(buildConfiguration)'

          - task: DotNetCoreCLI@2
            displayName: 'Executar Testes'
            inputs:
              command: 'test'
              projects: '**/*Tests*/*.csproj'
              arguments: '--configuration $(buildConfiguration)'

          - task: DotNetCoreCLI@2
            displayName: 'Publicar aplicação'
            inputs:
              command: 'publish'
              projects: 'BeaconSync.API/BeaconSync.API.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/app'
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            displayName: 'Guardar Artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/app'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  - stage: Deploy
    displayName: 'Estágio de Deploy no Azure'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployJob
        displayName: 'Deploy para Azure App Service'
        steps:
          - task: DownloadBuildArtifacts@0
            displayName: 'Baixar Artifact'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(System.DefaultWorkingDirectory)/drop'

          - task: AzureWebApp@1
            displayName: 'Deploy Web App: rm565206-beaconsync-api'
            inputs:
              azureSubscription: 'AzureServiceConnection'
              appName: '$(webAppName)'
              package: '$(System.DefaultWorkingDirectory)/drop/**/*.zip'