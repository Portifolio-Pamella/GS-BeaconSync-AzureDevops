trigger:
  - main

variables:
  buildConfiguration: 'Release'
  webAppName: 'rm565206-beaconsync-api'

pool:
  vmImage: 'ubuntu-latest'

steps:
  # 1. Instala o SDK do .NET 10 (necessário para os projetos em .NET 10)
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '10.x'

  # 2. Restaura usando o arquivo .slnx correto
  - script: dotnet restore BeaconSync.slnx
    displayName: 'Restaurar Dependências'

  # 3. Compila a solution .slnx inteira (todas as camadas e testes)
  - script: dotnet build BeaconSync.slnx --configuration $(buildConfiguration) --no-restore
    displayName: 'Compilar Solution .slnx'

  # 4. Publica especificamente a API gerando os binários
  - script: dotnet publish BeaconSync.API/BeaconSync.API.csproj --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/drop --no-build
    displayName: 'Publicar Projeto API'

  # 5. Faz o Deploy direto no Azure App Service
  - task: AzureWebApp@1
    inputs:
      azureSubscription: 'AzureServiceConnection'
      appName: '$(webAppName)'
      package: '$(Build.ArtifactStagingDirectory)/drop/**/*.zip'