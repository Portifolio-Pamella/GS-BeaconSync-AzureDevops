trigger:
  - main

# Aqui vinculamos o grupo de variáveis que criamos no Library do Azure DevOps
variables:
  - group: 'New variable group 10-nov' # Ou o nome que você colocou lá
  - buildConfiguration: 'Release'
  - webAppName: 'rm565206-beaconsync-api'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: 'Build da Solução em Camadas'
    jobs:
      - job: BuildJob
        displayName: 'Compilar e Publicar a API'
        steps:
          # 1. Instala o SDK do .NET 9 no agent do Azure DevOps
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '9.x'

          # 2. Restaura os pacotes NuGet de todas as camadas
          - script: dotnet restore BeaconSync.sln
            displayName: 'Restaurar Dependências'

          # 3. Compila a solution inteira
          - script: dotnet build BeaconSync.sln --configuration $(buildConfiguration) --no-restore
            displayName: 'Compilar Solution .NET'

          # 4. Publica o projeto da API
          - script: dotnet publish BeaconSync.API/BeaconSync.API.csproj --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/drop --no-build
            displayName: 'Publicar Projeto API'

          # 5. Empacota e disponibiliza o artefato
          - task: PublishBuildArtifacts@2
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)/drop'
              artifactName: 'drop'
              publishLocation: 'Container'

  - stage: Deploy
    displayName: 'Deploy no Azure App Service'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployWeb
        displayName: 'Deploy WebApp'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                # 6. Envia o pacote compilado para o App Service e injeta as variáveis de configuração
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    appName: '$(webAppName)'
                    package: '$(Pipeline.Workspace)/drop/**/*.zip'
                    # O App Service lê automaticamente variáveis no formato ConnectionStrings__* como Connection Strings